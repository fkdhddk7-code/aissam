<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réservation Auberge</title>
  <style>
    body { font-family: Arial; background: #fdf6ec; padding: 20px; }
    form { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);}
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; }
    input, select, button { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #1a1208; color: white; border: none; cursor: pointer; }
    button:hover { background: #333; }
    #formMessage { text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

<h2>Réservation Auberge</h2>

<form id="resForm">
  <div class="form-group">
    <label>Nom</label>
    <input type="text" name="name" placeholder="Votre nom" required>
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" name="email" placeholder="Votre email" required>
  </div>

  <div class="form-group">
    <label>Téléphone</label>
    <input type="text" name="phone" placeholder="Votre téléphone" required>
  </div>

  <div class="form-group">
    <label>Chambre</label>
    <select name="room" required>
      <option value="">Choisir une chambre</option>
      <option value="Standard">Standard</option>
      <option value="Suite">Suite</option>
    </select>
  </div>

  <div class="form-group">
    <label>Check-in</label>
    <input type="date" name="checkin" required>
  </div>

  <div class="form-group">
    <label>Check-out</label>
    <input type="date" name="checkout" required>
  </div>

  <button type="submit">Envoyer</button>
</form>

<div id="formMessage"></div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  emailjs.init("YOUR_PUBLIC_KEY"); // عوض بالمفتاح العام ديالك

  const form = document.getElementById("resForm");
  const formMessage = document.getElementById("formMessage");

  form.addEventListener("submit", function(e){
    e.preventDefault();

    emailjs.sendForm("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", this)
      .then(() => {
        formMessage.innerHTML = "<p style='color:green;'>Réservation envoyée avec succès !</p>";
        form.reset();
      }, (error) => {
        formMessage.innerHTML = "<p style='color:red;'>Erreur: Réservation non envoyée.</p>";
        console.error(error);
      });
  });
</script>

</body>
</html>
